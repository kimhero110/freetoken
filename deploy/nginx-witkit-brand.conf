# freetokens.info uses the same release artifact via Cloudflare Pages.
# This host-specific origin presents the WitKit brand hub at /.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = / { try_files /witkit/index.html =404; }
    location = /witkit/ { return 301 https://witkit.zone/; }
    location ~ ^/(?:en/)?(?:platform|article|articles|guide|about)(?:/|$) {
        return 301 https://freetokens.info$request_uri;
    }
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ $uri/index.html =404; }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
