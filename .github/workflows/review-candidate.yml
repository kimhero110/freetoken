name: Review candidate

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Candidate filename without .yaml or .json
        required: true
        type: string
      decision:
        description: Human review decision
        required: true
        type: choice
        options:
          - approve
          - reject
      approver_via:
        description: Approval channel annotation (authoritative identity is always github.actor)
        required: false
        default: ""
        type: string
      approver_id:
        description: Redacted approver identity annotation (e.g. feishu open_id prefix)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: freetoken-main-writer
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - name: Install hash-locked Python dependencies
        run: pip install --require-hashes -r scripts/requirements.lock

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install locked Node dependencies
        run: npm ci --prefix site

      - name: Apply and preserve the human decision
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          DECISION: ${{ inputs.decision }}
          REVIEWER: ${{ github.actor }}
          FEISHU_APPROVER_VIA: ${{ inputs.approver_via }}
          FEISHU_APPROVER_ID: ${{ inputs.approver_id }}
        run: |
          if [ "${#CANDIDATE_ID}" -gt 200 ] || [[ ! "$CANDIDATE_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Invalid candidate ID" >&2
            exit 2
          fi
          if [ "$DECISION" = "approve" ]; then
            GITHUB_ACTOR="$REVIEWER" python scripts/review_candidates.py --approve "$CANDIDATE_ID"
          elif [ "$DECISION" = "reject" ]; then
            GITHUB_ACTOR="$REVIEWER" python scripts/review_candidates.py --reject "$CANDIDATE_ID"
          else
            echo "Invalid review decision" >&2
            exit 2
          fi

          git config user.name "freetoken-bot[bot]"
          git config user.email "4818224+freetoken-bot[bot]@users.noreply.github.com"
          git add --all -- data/platforms data/platforms.json site/src/data/platforms.json data/reviews data/candidates .cache/hashes.json site/public/sitemap.xml
          if git diff --cached --quiet; then
            echo "Review produced no repository changes" >&2
            exit 1
          fi
          git commit -m "chore(data): record candidate review"

      - name: Merge the reviewed change through a gated pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          DECISION: ${{ inputs.decision }}
        run: |
          git pull --rebase origin main
          BRANCH="auto/review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin HEAD:refs/heads/"$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(data): record candidate review (${DECISION})" \
            --body "Automated candidate review commit from the gated Review candidate workflow. Candidate: ${CANDIDATE_ID} decision: ${DECISION}. Merging publishes the reviewed platform data through the verified production pipeline."
          gh pr checks "$BRANCH" --watch --interval 10
          gh pr merge "$BRANCH" --merge --delete-branch

      - name: Send isolated approval notification
        if: inputs.decision == 'approve'
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python scripts/notify_review.py --candidate-id "$CANDIDATE_ID"
