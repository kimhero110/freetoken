name: Review candidate

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Candidate filename without .yaml or .json
        required: true
        type: string
      decision:
        description: Human review decision
        required: true
        type: choice
        options:
          - approve
          - reject

permissions:
  contents: write

concurrency:
  group: freetoken-main-writer
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - name: Install hash-locked Python dependencies
        run: pip install --require-hashes -r scripts/requirements.lock

      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install locked Node dependencies
        run: npm ci --prefix site

      - name: Apply and preserve the human decision
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          DECISION: ${{ inputs.decision }}
          REVIEWER: ${{ github.actor }}
        run: |
          if [ "${#CANDIDATE_ID}" -gt 200 ] || [[ ! "$CANDIDATE_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Invalid candidate ID" >&2
            exit 2
          fi

          if [ "$DECISION" = "approve" ]; then
            GITHUB_ACTOR="$REVIEWER" python scripts/review_candidates.py --approve "$CANDIDATE_ID"
          elif [ "$DECISION" = "reject" ]; then
            GITHUB_ACTOR="$REVIEWER" python scripts/review_candidates.py --reject "$CANDIDATE_ID"
          else
            echo "Invalid review decision" >&2
            exit 2
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- data/platforms data/platforms.json site/src/data/platforms.json data/reviews data/candidates site/public/sitemap.xml
          if git diff --cached --quiet; then
            echo "Review produced no repository changes" >&2
            exit 1
          fi
          git commit -m "chore(data): record candidate review [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Send isolated approval notification
        if: inputs.decision == 'approve'
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python scripts/notify_review.py --candidate-id "$CANDIDATE_ID"
