name: 全球新免费 Token 平台雷达自动扫描

on:
  schedule:
    # 每 2 天一次，北京时间凌晨 02:30 (UTC 18:30) 在 DeepSeek 波谷五折期自动巡检新源
    - cron: '30 18 */2 * *'
  workflow_dispatch: # 支持随时手动一键探测

permissions:
  contents: read

concurrency:
  group: freetoken-main-writer
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: 安装 Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - name: 安装依赖
        run: pip install --require-hashes -r scripts/requirements.lock

      - name: 启动自动发现雷达
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python scripts/discover_new_platforms.py

      - name: 提交待审候选源至 GitHub
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name 'freetoken-bot[bot]'
          git config user.email '4818224+freetoken-bot[bot]@users.noreply.github.com'
          git add data/candidates/
          if git diff --cached --quiet; then
            echo '无新候选平台，跳过提交'
          else
            git commit -m 'feat(radar): 发现新候选平台草稿，已推送飞书并等待人工决策'
            git pull --rebase origin main
            BRANCH="auto/radar-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git push origin HEAD:refs/heads/"$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title 'feat(radar): 发现新候选平台草稿' \
              --body '雷达发现的新候选平台，仅写入 data/candidates/，正式收录仍需人工审批。'
            gh pr merge --auto --merge --delete-branch "$BRANCH"
          fi

