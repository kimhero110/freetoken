name: 全球新免费 Token 平台雷达自动扫描

on:
  schedule:
    # 每 2 天一次，北京时间凌晨 02:30 (UTC 18:30) 在 DeepSeek 波谷五折期自动巡检新源
    - cron: '30 18 */2 * *'
  workflow_dispatch: # 支持随时手动一键探测

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 启动自动发现雷达
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL || '<REMOVED_FEISHU_WEBHOOK>' }}
        run: python scripts/discover_new_platforms.py

      - name: 提交待审候选源至 GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/candidates/
          if git diff --cached --quiet; then
            echo '无新候选平台，跳过提交'
          else
            git commit -m 'feat(radar): 发现新候选平台草稿，已推送飞书并等待人工决策 [skip ci]'
            git push origin main
          fi

