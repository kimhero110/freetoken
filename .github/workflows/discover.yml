name: 全球新免费 Token 平台雷达自动扫描

on:
  schedule:
    # 每 2 天一次，北京时间凌晨 02:30 (UTC 18:30) 巡检新源（此脚本不调用大模型）
    - cron: '30 18 */2 * *'
  workflow_dispatch: # 支持随时手动一键探测

permissions:
  contents: read

concurrency:
  group: freetoken-main-writer
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: 安装 Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - name: 安装依赖
        run: pip install --require-hashes -r scripts/requirements.lock

      - name: 启动自动发现雷达
        id: discover
        continue-on-error: true
        run: python scripts/discover_new_platforms.py

      - name: 发布成功生成的候选
        id: publish
        if: ${{ !cancelled() && steps.discover.outcome != 'skipped' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python -m scripts.publish_candidates --summary "$RUNNER_TEMP/publish-summary.json"

      - name: 汇总真实运行结果
        if: ${{ !cancelled() }}
        env:
          FETCH_OUTCOME: ${{ steps.discover.outcome }}
          EXTRACT_OUTCOME: success
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: python -m scripts.check_summary
