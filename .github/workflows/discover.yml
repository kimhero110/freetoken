name: 全球新免费 Token 平台雷达自动扫描

on:
  schedule:
    # 每 2 天一次，北京时间凌晨 02:30 (UTC 18:30) 在 DeepSeek 波谷五折期自动巡检新源
    - cron: '30 18 */2 * *'
  workflow_dispatch: # 支持随时手动一键探测

permissions:
  contents: write

concurrency:
  group: freetoken-main-writer
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - name: 安装依赖
        run: pip install --require-hashes -r scripts/requirements.lock

      - name: 启动自动发现雷达
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python scripts/discover_new_platforms.py

      - name: 提交待审候选源至 GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/candidates/
          if git diff --cached --quiet; then
            echo '无新候选平台，跳过提交'
          else
           git commit -m 'feat(radar): 发现新候选平台草稿，已推送飞书并等待人工决策 [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi

