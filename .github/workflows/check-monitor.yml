name: 独立检查监控心跳
# Rewrites monitor-status/check-status.json from workflow runs and the public
# ledger. Alerts when that document is unhealthy. Pages once per actionable
# incident after INCIDENT_ALERT_MIN_STREAK consecutive extract/fetch failures
# (default 2). Sends at most one UTC-day digest (INCIDENT_DIGEST, default on)
# of incidents that are still open. Both use FEISHU_WEBHOOK_URL and
# FEISHU_SECRET. Deferred pauses, pending_review, and dry runs are not paged.
# The nginx file at https://witkit.zone/ops/check-status.json froze when the
# intake daemon was removed and is not the probe target.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      exercise:
        description: '独立通知通道联调（不调用模型）'
        type: choice
        default: none
        options: [none, failure, recovery]
permissions:
  contents: read
concurrency:
  group: freetoken-external-heartbeat
  cancel-in-progress: false
jobs:
  heartbeat:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint scoped state writer
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Check heartbeat and notify independently
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXERCISE: ${{ inputs.exercise || 'none' }}
          INCIDENT_ALERT_MIN_STREAK: ${{ vars.INCIDENT_ALERT_MIN_STREAK || '2' }}
          INCIDENT_DIGEST: ${{ vars.INCIDENT_DIGEST || 'on' }}
        run: python -m scripts.check_external_monitor --exercise "$EXERCISE"
