name: 独立检查监控心跳
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      exercise:
        description: '独立通知通道联调（不调用模型）'
        type: choice
        default: none
        options: [none, failure, recovery]
permissions:
  contents: read
concurrency:
  group: freetoken-external-heartbeat
  cancel-in-progress: false
jobs:
  heartbeat:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint scoped state writer
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Check heartbeat and notify independently
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          EXERCISE: ${{ inputs.exercise || 'none' }}
        run: python -m scripts.check_external_monitor --exercise "$EXERCISE"
