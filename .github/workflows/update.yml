name: 定时生成免费额度变更候选

on:
  schedule:
    # 限制在 DeepSeek 官方优惠波谷时段运行（北京时间 00:30~08:30，享五折）
    # UTC 17:30 / 20:30 / 23:30 对应北京时间 01:30 / 04:30 / 07:30
    - cron: "30 17,20,23 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "选择提取使用的模型提供商 (default 为 config/llm.yaml 默认)"
        required: false
        default: "default"
        type: choice
        options:
          - "default"
          - "deepseek"
          - "siliconflow"
          - "kimi"
          - "dashscope"
          - "custom_proxy"
      strategy:
        description: "调用策略 (specified 单模型 / fallback 回退 / load_balance 负载均衡)"
        required: false
        default: "default"
        type: choice
        options:
          - "default"
          - "specified"
          - "fallback"
          - "load_balance"
      model_override:
        description: "覆盖模型名称 (如 deepseek-chat, qwen-plus，选填)"
        required: false
        type: string
        default: ""
      ignore_off_peak:
        description: "忽略 DeepSeek 波谷时段保护强制执行"
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # 仅回写待人工审核的候选提案

concurrency:
  group: freetoken-quota-extraction
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - name: 安装 Python 依赖
        run: pip install --require-hashes -r scripts/requirements.lock

      - name: 抓取来源页面（变更检测）
        run: python scripts/fetch_sources.py

      - name: 调用大模型提取结构化信息 (灵活自定义模式)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          CUSTOM_LLM_KEY: ${{ secrets.CUSTOM_LLM_KEY }}
          PROVIDER_INPUT: ${{ inputs.provider }}
          STRATEGY_INPUT: ${{ inputs.strategy }}
          MODEL_OVERRIDE_INPUT: ${{ inputs.model_override }}
          IGNORE_OFF_PEAK_INPUT: ${{ inputs.ignore_off_peak }}
        run: |
          ARGS=()
          if [ "$PROVIDER_INPUT" != "default" ] && [ -n "$PROVIDER_INPUT" ]; then
            ARGS+=(--provider "$PROVIDER_INPUT")
          fi
          if [ "$STRATEGY_INPUT" != "default" ] && [ -n "$STRATEGY_INPUT" ]; then
            ARGS+=(--strategy "$STRATEGY_INPUT")
          fi
          if [ -n "$MODEL_OVERRIDE_INPUT" ]; then
            if [[ ! "$MODEL_OVERRIDE_INPUT" =~ ^[A-Za-z0-9._:/-]{1,128}$ ]]; then
              echo "Invalid model override" >&2
              exit 2
            fi
            ARGS+=(--model "$MODEL_OVERRIDE_INPUT")
          fi
          if [ "$IGNORE_OFF_PEAK_INPUT" = "true" ]; then
            ARGS+=(--ignore-off-peak)
          fi
          python scripts/extract.py "${ARGS[@]}"

      - name: 回写待人工审核候选
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates/
          if git diff --cached --quiet; then
            echo "无新候选，跳过提交"
          else
            git commit -m "chore(data): 提交待审核额度变更候选 [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
