name: 定时生成免费额度变更候选

on:
  schedule:
    # 按既有费用窗口排队；延迟执行仍需重新检查费用策略
    # UTC 17:30 / 20:30 / 23:30 对应北京时间 01:30 / 04:30 / 07:30
    - cron: "30 17 * * *"
    - cron: "30 20 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "选择提取使用的模型提供商 (default 为 config/llm.yaml 默认)"
        required: false
        default: "default"
        type: choice
        options:
          - "default"
          - "deepseek"
          - "siliconflow"
          - "kimi"
          - "dashscope"
          - "custom_proxy"
      strategy:
        description: "调用策略 (specified 单模型 / fallback 回退 / load_balance 负载均衡)"
        required: false
        default: "default"
        type: choice
        options:
          - "default"
          - "specified"
          - "fallback"
          - "load_balance"
      model_override:
        description: "覆盖模型名称 (如 deepseek-chat, qwen-plus，选填)"
        required: false
        type: string
        default: ""
      ignore_off_peak:
        description: "忽略 DeepSeek 波谷时段保护强制执行"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: freetoken-main-writer
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: 安装 Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - name: 安装 Python 依赖
        run: pip install --require-hashes -r scripts/requirements.lock

      - name: 抓取来源页面（变更检测）
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_sources.py

      - name: 调用大模型提取结构化信息 (持久化保护)
        id: extract
        continue-on-error: true
        env:
          CHECK_PAID_ENABLED: ${{ vars.CHECK_PAID_ENABLED == 'true' && vars.CHECK_READINESS_CONFIRMED == 'true' }}
          CHECK_MAX_CALLS: ${{ vars.CHECK_MAX_CALLS }}
          CHECK_MAX_OUTPUT_TOKENS: ${{ vars.CHECK_MAX_OUTPUT_TOKENS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          CUSTOM_LLM_KEY: ${{ secrets.CUSTOM_LLM_KEY }}
          PROVIDER_INPUT: ${{ inputs.provider }}
          STRATEGY_INPUT: ${{ inputs.strategy }}
          MODEL_OVERRIDE_INPUT: ${{ inputs.model_override }}
          IGNORE_OFF_PEAK_INPUT: ${{ inputs.ignore_off_peak }}
        run: |
          ARGS=()
          if [ "$PROVIDER_INPUT" != "default" ] && [ -n "$PROVIDER_INPUT" ]; then
            ARGS+=(--provider "$PROVIDER_INPUT")
          fi
          if [ "$STRATEGY_INPUT" != "default" ] && [ -n "$STRATEGY_INPUT" ]; then
            ARGS+=(--strategy "$STRATEGY_INPUT")
          fi
          if [ -n "$MODEL_OVERRIDE_INPUT" ]; then
            if [[ ! "$MODEL_OVERRIDE_INPUT" =~ ^[A-Za-z0-9._:/-]{1,128}$ ]]; then
              echo "Invalid model override" >&2
              exit 2
            fi
            ARGS+=(--model "$MODEL_OVERRIDE_INPUT")
          fi
          if [ "$IGNORE_OFF_PEAK_INPUT" = "true" ]; then
            ARGS+=(--ignore-off-peak)
          fi
          python scripts/extract.py "${ARGS[@]}"

      - name: 发布成功生成的候选
        id: publish
        if: ${{ !cancelled() && steps.extract.outcome != 'skipped' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python -m scripts.publish_candidates --summary "$RUNNER_TEMP/publish-summary.json"

      - name: 汇总真实运行结果
        if: ${{ !cancelled() }}
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          EXTRACT_OUTCOME: ${{ steps.extract.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: python -m scripts.check_summary
