name: 定时更新免费额度数据并构建站点

on:
  schedule:
    # 限制在 DeepSeek 官方优惠波谷时段运行（北京时间 00:30~08:30，享五折）
    # UTC 17:30 / 20:30 / 23:30 对应北京时间 01:30 / 04:30 / 07:30
    - cron: "30 17,20,23 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "选择提取使用的模型提供商 (default 为 config/llm.yaml 默认)"
        required: false
        default: "default"
        type: choice
        options:
          - "default"
          - "deepseek"
          - "siliconflow"
          - "kimi"
          - "dashscope"
          - "custom_proxy"
      strategy:
        description: "调用策略 (specified 单模型 / fallback 回退 / load_balance 负载均衡)"
        required: false
        default: "default"
        type: choice
        options:
          - "default"
          - "specified"
          - "fallback"
          - "load_balance"
      model_override:
        description: "覆盖模型名称 (如 deepseek-chat, qwen-plus，选填)"
        required: false
        type: string
        default: ""
      ignore_off_peak:
        description: "忽略 DeepSeek 波谷时段保护强制执行"
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # 需要回写 main 分支数据与 deploy 分支构建产物

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安装 Python 依赖
        run: pip install -r scripts/requirements.txt

      - name: 抓取来源页面（变更检测）
        run: python scripts/fetch_sources.py

      - name: 调用大模型提取结构化信息 (灵活自定义模式)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          CUSTOM_LLM_KEY: ${{ secrets.CUSTOM_LLM_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.provider }}" != "default" ] && [ -n "${{ inputs.provider }}" ]; then
            ARGS="$ARGS --provider ${{ inputs.provider }}"
          fi
          if [ "${{ inputs.strategy }}" != "default" ] && [ -n "${{ inputs.strategy }}" ]; then
            ARGS="$ARGS --strategy ${{ inputs.strategy }}"
          fi
          if [ -n "${{ inputs.model_override }}" ]; then
            ARGS="$ARGS --model ${{ inputs.model_override }}"
          fi
          if [ "${{ inputs.ignore_off_peak }}" = "true" ]; then
            ARGS="$ARGS --ignore-off-peak"
          fi
          python scripts/extract.py $ARGS

      - name: 合并生成站点数据
        run: python scripts/build_data.py

      - name: 回写数据与缓存到 main 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/platforms/ .cache/ site/src/data/platforms.json
          if git diff --cached --quiet; then
            echo "数据无变更，跳过提交"
          else
            git commit -m "chore(data): 自动更新平台额度数据 [skip ci]"
            git push origin main
          fi

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 构建静态站点
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: 推送构建产物到 deploy 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 在临时目录初始化仅含 dist 内容的 orphan 提交，推送到 deploy 分支
          DEPLOY_DIR=$(mktemp -d)
          cp -r site/dist/. "$DEPLOY_DIR/"
          cd "$DEPLOY_DIR"
          git init -b deploy
          git add -A
          git commit -m "deploy: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin deploy
