name: Capability probe candidates

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:
    inputs:
      provider:
        description: Canonical provider to probe
        required: true
        type: choice
        options:
          - deepseek
          - siliconflow
          - aliyun-bailian
          - moonshot-kimi
          - google-ai-studio
          - groq
          - volcengine
          - zhipu-ai
          - openrouter
          - gmi-cloud-minimax

permissions:
  contents: write

concurrency:
  group: freetoken-main-writer
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - name: Install hash-locked dependencies
        run: pip install --require-hashes -r scripts/requirements.lock

      - name: Probe capability
        id: probe
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROVIDER: ${{ inputs.provider }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ALIYUN_BAILIAN_API_KEY: ${{ secrets.ALIYUN_BAILIAN_API_KEY }}
          MOONSHOT_KIMI_API_KEY: ${{ secrets.MOONSHOT_KIMI_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VOLCENGINE_API_KEY: ${{ secrets.VOLCENGINE_API_KEY }}
          ZHIPU_AI_API_KEY: ${{ secrets.ZHIPU_AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMI_CLOUD_MINIMAX_API_KEY: ${{ secrets.GMI_CLOUD_MINIMAX_API_KEY }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python scripts/probe_capabilities.py --all-configured --operation chat_completions
          else
            python scripts/probe_capabilities.py --provider "$PROVIDER" --operation chat_completions
          fi

      - name: Preserve the observation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- data/candidates/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): record capability probe candidate [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Report probe failure after preserving evidence
        if: steps.probe.outcome == 'failure'
        run: exit 1
