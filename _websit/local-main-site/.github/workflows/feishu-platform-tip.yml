name: Feishu platform tip

on:
  workflow_dispatch:
    inputs:
      url:
        description: HTTPS source URL from the Feishu tip
        required: true
        type: string
      note:
        description: Operator note from the tip
        required: false
        default: ""
        type: string
      ticket_id:
        description: Intake ticket id for traceability
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: freetoken-main-writer
  cancel-in-progress: false

jobs:
  tip:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - name: Install hash-locked dependencies
        run: pip install --require-hashes -r scripts/requirements.lock

      - name: Extract tip into a candidate
        env:
          TIP_URL: ${{ inputs.url }}
          TIP_NOTE: ${{ inputs.note }}
          TICKET_ID: ${{ inputs.ticket_id }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [[ ! "$TIP_URL" =~ ^https://[^[:space:]]{3,300}$ ]]; then
            echo "Invalid tip URL" >&2
            exit 2
          fi
          if ! [[ "$TICKET_ID" =~ ^[a-z0-9-]{1,64}$ ]]; then
            echo "Invalid ticket id" >&2
            exit 2
          fi
          python scripts/platform_tip.py --url "$TIP_URL" --note "$TIP_NOTE" --ticket-id "$TICKET_ID"

      - name: Open gated pull request for the candidate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TICKET_ID: ${{ inputs.ticket_id }}
        run: |
          git config user.name "freetoken-bot[bot]"
          git config user.email "4818224+freetoken-bot[bot]@users.noreply.github.com"
          git add --all -- data/candidates/
          if git diff --cached --quiet; then
            echo "No candidate produced" >&2
            exit 1
          fi
          git commit -m "chore(data): platform tip candidate ${TICKET_ID}"
          git pull --rebase origin main
          BRANCH="auto/tip-${TICKET_ID}"
          git push origin HEAD:refs/heads/"$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(data): platform tip candidate ${TICKET_ID}" \
            --body "Feishu tip ${TICKET_ID}. Candidate data only; canonical changes still require the gated Review candidate workflow."
          gh pr merge --auto --merge --delete-branch "$BRANCH"
